<!DOCTYPE html>
<html lang="en">
<head><title>Polls</title></head>
<body>
<nav>
  <a href="{% url 'polls:index' %}">Home</a> |
  <a href="{% url 'polls:search' %}">Search</a> |
  {% if user.is_authenticated %}
    Signed in as {{ user.username }} |
    <a href="{% url 'polls:create' %}">Create poll</a> |
    <a href="{% url 'polls:my_polls' %}">My polls</a> |
    <form action="{% url 'logout' %}" method="post" style="display:inline">
      {% csrf_token %}
      <button type="submit">Log out</button>
    </form>
  {% else %}
    <a href="{% url 'login' %}">Log in</a> |
    <a href="{% url 'polls:signup' %}">Sign up</a>
  {% endif %}
</nav>
<hr>
{% block content %}{% endblock %}
</body>
</html>
