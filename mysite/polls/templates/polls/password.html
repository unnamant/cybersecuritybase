{% extends "polls/base.html" %}
{% block content %}

<h1>{{ question.question_text }}</h1>
<p>This poll is private. Enter the access password.</p>
{% if error %}<p class="errorlist">{{ error }}</p>{% endif %}
<form method="post">
  {% csrf_token %}
  <input type="password" name="access_password">
  <button type="submit">Open poll</button>
</form>

{% endblock %}
